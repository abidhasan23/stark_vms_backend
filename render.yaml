services:
  - type: web
    name: stark-vms-backend
    runtime: java
    plan: free
    buildCommand: ./gradlew build -x test
    startCommand: java -jar build/libs/stark-vms-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SERVER_PORT
        value: 8080

