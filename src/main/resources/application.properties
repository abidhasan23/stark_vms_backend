spring.application.name=stark-vms-backend

# Server - Render uses PORT env var
server.port=${PORT:9001}

# MySQL via Render's DATABASE_URL env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stark_vms_assignment1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson
spring.jackson.mapper.sort-properties-alphabetically=false
spring.jackson.serialization.write-dates-as-timestamps=false
